site_name: HA-LVGL
site_url: https://gwiezdnyszeryf.github.io/HA-LVGL/
repo_url: https://github.com/GwiezdnySzeryf/HA-LVGL
repo_name: GwiezdnySzeryf/HA-LVGL
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/home-assistant
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: teal
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Moes Tweaks: moes-tweaks/index.md
  - Home: index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GwiezdnySzeryf
      name: GwiezdnySzeryf on GitHub
